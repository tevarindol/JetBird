workspace:
  base: /build
  path: repo

steps:
  build_debug:
    image: ubuntu:noble-20240827.1
    environment:
      ANDROID_HOME: /build/sdk
      DEBIAN_FRONTEND: noninteractive
      GOBIN: /build/go/bin
      JAVA_HOME: /build/jdk-21.0.5
    commands:
      - ./scripts/provision.sh
      - ./scripts/init_go.sh
      - ./scripts/build_netbird.sh -v
      - ./gradlew :app:assembleDebug --stacktrace --no-build-cache --no-configuration-cache --no-daemon
    when:
      path: [app/**, build.gradle.kts, .woodpecker.yml, scripts/*]
      event: [pull_request]
      evaluate: 'not (CI_COMMIT_AUTHOR == "translate")'

  build_release:
    image: ubuntu:noble-20240827.1
    environment:
      ANDROID_HOME: /build/sdk
      DEBIAN_FRONTEND: noninteractive
      GOBIN: /build/go/bin
      JAVA_HOME: /build/jdk-21.0.5
    commands:
      - ./scripts/provision.sh
      - ./scripts/init_go.sh
      - ./scripts/build_netbird.sh -v
      - ./gradlew :app:assembleRelease --stacktrace --no-build-cache --no-configuration-cache --no-daemon
    when:
      event: [tag]

  sign_release:
    image: ubuntu:noble-20240827.1
    environment:
      ANDROID_HOME: /build/sdk
      DEBIAN_FRONTEND: noninteractive
      JAVA_HOME: /build/jdk-21.0.5
      APK_KS:
        from_secret: APK_KS
      APK_KS_ALIAS:
        from_secret: APK_KS_ALIAS
      APK_KS_PASS:
        from_secret: APK_KS_PASS
    commands:
      - ./scripts/apk_sign.sh
    when:
      event: [tag]

  publish:
    image: woodpeckerci/plugin-gitea-release
    settings:
      base_url: https://codeberg.org
      files:
        - JetBird-arm64-v8a-release.apk
        - JetBird-armeabi-v7a-release.apk
        - JetBird-universal-release.apk
        - JetBird-x86-release.apk
        - JetBird-x86_64-release.apk
      api_key:
        from_secret: GIT_ACCESS_TOKEN
      target: master
      prerelease: true
    when:
      event: [tag]
when:
  event: [tag, pull_request]
